name = "lillofind"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Variabili pubbliche (non segrete). Sovrascrivibili in dashboard.
[vars]
FIREBASE_PROJECT_ID = "lillofind-c455c"
# Origini ammesse per CORS (frontend). Separare con virgola.
ALLOWED_ORIGINS = "https://lillofind.shop,https://www.lillofind.shop,https://lillofind-c455c.web.app,https://lillofind-c455c.firebaseapp.com,http://localhost:8000,http://localhost:5000"
# Email autorizzate a inviare tracking ai clienti (separare con virgola).
ADMIN_EMAILS = "yishionvt@gmail.com,admin@lillofind.com"
# Mittente email — dominio lillofind.shop verificato su Resend.
RESEND_FROM = "LilloFind <noreply@lillofind.shop>"
# Base pubblica del Worker: serve a /streamPlay per costruire l'URL del
# proxy manifest HLS, che il browser deve poter raggiungere in assoluto.
WORKER_PUBLIC_BASE = "https://lillofind.conti9708.workers.dev"

# ───────────────────────────────────────────────────────────────
# SECRET da impostare con `wrangler secret put <NOME>` (NON qui):
#   STRIPE_SECRET_KEY        → chiave segreta Stripe (sk_live_... / sk_test_...)
#   RESEND_API_KEY           → chiave Resend per email ordini
#   ANTHROPIC_API_KEY        → chiave Anthropic per yupooAnalyze
#   FIREBASE_SERVICE_ACCOUNT → JSON completo del service account (una riga)
#   TMDB_API_KEY             → API key v3 di TMDB per la sezione "Cosa guardare"
#                              (gratis: themoviedb.org → Settings → API → API Key v3)
# ───────────────────────────────────────────────────────────────
