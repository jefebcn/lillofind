name = "lillofind"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Log del Worker conservati in dashboard (Workers → lillofind → Logs):
# qui finiscono anche gli errori JavaScript del sito (/clientError).
# Cron (orari UTC; devono coincidere con CRON_* in src/index.js):
#   ogni 4 ore al minuto 23 → tracking, novità catalogo, promemoria carrello/ordini
#   ogni 15 minuti          → controllo foto rotte (un gruppo di prodotti per volta)
#   05:41 ogni giorno       → promemoria abbonamenti + riepilogo del mattino (07:41 in Italia d'estate)
[triggers]
crons = ["23 */4 * * *", "*/15 * * * *", "41 5 * * *"]

[observability]
enabled = true

# Variabili pubbliche (non segrete). Sovrascrivibili in dashboard.
[vars]
FIREBASE_PROJECT_ID = "lillofind-c455c"
# Origini ammesse per CORS (frontend). Separare con virgola.
ALLOWED_ORIGINS = "https://lillofind.shop,https://www.lillofind.shop,https://lillofind-c455c.web.app,https://lillofind-c455c.firebaseapp.com"
# Email autorizzate a inviare tracking ai clienti (separare con virgola).
ADMIN_EMAILS = "yishionvt@gmail.com,admin@lillofind.com"
# Mittente email — dominio lillofind.shop verificato su Resend.
RESEND_FROM = "LilloFind <noreply@lillofind.shop>"
# Base pubblica del Worker: serve a /streamPlay per costruire l'URL del
# proxy manifest HLS, che il browser deve poter raggiungere in assoluto.
WORKER_PUBLIC_BASE = "https://lillofind.conti9708.workers.dev"

# ───────────────────────────────────────────────────────────────
# SECRET da impostare con `wrangler secret put <NOME>` (NON qui):
#   STRIPE_SECRET_KEY        → chiave segreta Stripe (sk_live_... / sk_test_...)
#   RESEND_API_KEY           → chiave Resend per email ordini
#   ANTHROPIC_API_KEY        → chiave Anthropic per yupooAnalyze
#   FIREBASE_SERVICE_ACCOUNT → JSON completo del service account (una riga)
#   DHL_API_KEY              → chiave GRATUITA developer.dhl.com (Shipment Tracking - Unified):
#                              tracking automatico DHL / Deutsche Post (250 controlli al giorno)
#   TRACK17_TOKEN            → chiave API 17TRACK (facoltativa, a pagamento)
#   PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET → app REST PayPal Business (pagamento automatico)
#   TMDB_API_KEY             → API key v3 di TMDB per la sezione "Cosa guardare"
#                              (gratis: themoviedb.org → Settings → API → API Key v3)
# ───────────────────────────────────────────────────────────────
