name: Deploy Cloudflare Worker (API backend)

# Deploy automatico quando cambiano file del Worker (push su main).
# Avviabile anche a mano: GitHub → Actions → "Deploy Cloudflare Worker" → Run workflow.
#
# Prerequisiti (una-tantum):
#   1. Crea un API token Cloudflare:
#        Dashboard → My Profile → API Tokens → Create Token
#        Template: "Edit Cloudflare Workers"  (oppure custom con permesso Workers:Edit)
#   2. Aggiungi 2 secret al repo GitHub (Settings → Secrets → Actions):
#        CLOUDFLARE_API_TOKEN   = il token creato sopra
#        CLOUDFLARE_ACCOUNT_ID  = il tuo Account ID (Cloudflare dashboard, colonna destra)
#   3. Imposta i 4 secret del Worker (solo una volta, in Cloudflare Dashboard):
#        Workers → lillofind-worker → Settings → Variables → Encrypt
#          FIREBASE_SERVICE_ACCOUNT   (JSON su una riga)
#          STRIPE_SECRET_KEY
#          RESEND_API_KEY
#          ANTHROPIC_API_KEY

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/cloudflare-worker-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Spazio KV "catalog" per il catalogo dello shop (0 letture Firestore per
      # visita). Lo crea se non esiste e lo collega al Worker come CATALOG.
      - name: KV catalogo (crea se manca e collega)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          find_id() {
            npx wrangler kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title==="lillofind-catalog");process.stdout.write(n?n.id:"")}catch(e){}})'
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then npx wrangler kv namespace create catalog; ID="$(find_id)"; fi
          if [ -z "$ID" ]; then echo "Impossibile creare/trovare il KV 'lillofind-catalog'"; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "CATALOG"\nid = "%s"\n' "$ID" >> wrangler.toml
          echo "KV catalogo collegato: $ID"

      # Anche Cloudflare Workers Builds pubblica questo Worker a ogni push: se
      # parte nello stesso momento, il caricamento dei secret fallisce
      # ("latest version isn't currently deployed", code 10214). In quel caso
      # si aspetta che finisca e si riprova una volta.
      - name: Deploy Worker
        id: deploy1
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
          # Service account per il Worker. Va usato quello DEDICATO
          # (secret GitHub WORKER_SERVICE_ACCOUNT, solo i permessi che servono:
          # vedi SICUREZZA.md). Finché non c'è, si usa ancora quello del deploy
          # Firebase (GOOGLE_CREDENTIALS), che ha molti più permessi del
          # necessario: se il Worker venisse compromesso, lo sarebbe anche il deploy.
          secrets: |
            FIREBASE_SERVICE_ACCOUNT
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.WORKER_SERVICE_ACCOUNT || secrets.GOOGLE_CREDENTIALS }}

      - name: Attendi Workers Builds prima di riprovare
        if: steps.deploy1.outcome == 'failure'
        run: sleep 90

      - name: Deploy Worker (secondo tentativo)
        if: steps.deploy1.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
          # Service account per il Worker. Va usato quello DEDICATO
          # (secret GitHub WORKER_SERVICE_ACCOUNT, solo i permessi che servono:
          # vedi SICUREZZA.md). Finché non c'è, si usa ancora quello del deploy
          # Firebase (GOOGLE_CREDENTIALS), che ha molti più permessi del
          # necessario: se il Worker venisse compromesso, lo sarebbe anche il deploy.
          secrets: |
            FIREBASE_SERVICE_ACCOUNT
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.WORKER_SERVICE_ACCOUNT || secrets.GOOGLE_CREDENTIALS }}
