# Sposta in products_private i costi, il ¥ e il link alla fonte rimasti nel
# documento pubblico dei prodotti importati. Legge solo i prodotti che li hanno.
# Parte da solo quando questo file o lo script cambiano su main. Nei log solo conteggi.
name: Dati privati prodotti

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-private-fields.yml'
      - 'scripts/move-private-fields.mjs'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Solo anteprima (1 = non salva)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: move-private-fields
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Credenziali Google (service account Firebase)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: printf '%s' "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/gcloud-key.json"

      - name: Sposta i campi privati
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
          DRY: ${{ github.event.inputs.dry || '0' }}
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-admin@12 >/dev/null
          node move-private-fields.mjs
