# Pubblica ogni mattina il catalogo dello shop su Cloudflare KV.
# Lo shop legge il catalogo da lì (GET /catalog del Worker): 0 letture
# Firestore per visita. Questo job legge i prodotti UNA volta (~6.400 letture,
# ~13% della quota gratuita) subito dopo il reset giornaliero della quota.
# Avviabile anche a mano: GitHub → Actions → "Pubblica catalogo shop" → Run workflow.
name: Pubblica catalogo shop

on:
  schedule:
    - cron: '3 7 * * *'   # 09:03 ora legale italiana (reset quota = mezzanotte Pacifico)
    - cron: '3 8 * * *'   # 09:03 ora solare / rinfresco
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Il giro programmato legge tutti i prodotti (~7000 letture della quota
      # Firestore di 50.000 al giorno): si salta se il catalogo è già aggiornato
      # (nessuna modifica in sospeso e pubblicato da meno di 3 giorni). A mano
      # (Run workflow) si ripubblica sempre.
      - name: Serve ripubblicare?
        id: need
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          M="$(curl -s --max-time 20 'https://lillofind.conti9708.workers.dev/catalog?meta=1' || echo '{}')"
          GO="$(node -e 'try{const m=JSON.parse(process.argv[1]);const age=Date.now()-(+m.builtAtMs||0);process.stdout.write(m.dirty||!(m.count>0)||age>72*3600e3?"1":"0")}catch(e){process.stdout.write("1")}' "$M")"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          [ "$GO" = 1 ] || echo "Catalogo già aggiornato: niente da ripubblicare."

      - name: Credenziali Google (service account Firebase)
        if: steps.need.outputs.go == '1'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: printf '%s' "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/gcloud-key.json"

      - name: Leggi i prodotti da Firestore
        if: steps.need.outputs.go == '1'
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-admin@12 >/dev/null
          node publish-catalog.mjs

      - name: Dipendenze Worker (wrangler)
        if: steps.need.outputs.go == '1'
        working-directory: cloudflare-worker
        run: npm ci

      - name: Scrivi il catalogo nel KV
        if: steps.need.outputs.go == '1'
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          ID="$(npx wrangler kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title==="lillofind-catalog");process.stdout.write(n?n.id:"")}catch(e){}})')"
          if [ -z "$ID" ]; then echo "KV 'lillofind-catalog' non trovato"; exit 1; fi
          npx wrangler kv key put catalog --path ../scripts/catalog.json --namespace-id "$ID"
          npx wrangler kv key put "catalog:meta" --path ../scripts/catalog-meta.json --namespace-id "$ID"
          npx wrangler kv key get "catalog:albums" --namespace-id "$ID" > ../scripts/albums-old.json 2>/dev/null || echo "[]" > ../scripts/albums-old.json
          node ../scripts/merge-albums.mjs ../scripts/albums-old.json ../scripts/catalog-albums.json
          npx wrangler kv key put "catalog:albums" --path ../scripts/catalog-albums.json --namespace-id "$ID"
          echo "Catalogo pubblicato nel KV $ID"
          curl -s "https://lillofind.conti9708.workers.dev/catalog?meta=1"
