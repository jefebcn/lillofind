# Corregge categoria, taglie, marchio, modello, nome, genere e stile dei
# prodotti catalogati male (scripts/catalog-fixes.json) e aggiorna il catalogo
# dello shop nel KV con le sole modifiche fatte.
# Parte quando questo file, lo script o l'elenco cambiano su main; si può
# rilanciare a mano: GitHub → Actions → "Correzioni catalogo" → Run workflow.
# Quota Firestore: al massimo MAX_DOCS prodotti per giro (1 lettura + 1
# scrittura ciascuno) e nessuna rilettura del catalogo intero, così non si
# consuma la quota che serve agli ordini. Nei log solo conteggi.
name: Correzioni catalogo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-catalog-categories.yml'
      - 'scripts/fix-catalog-categories.mjs'
      - 'scripts/catalog-fixes.json'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Solo anteprima (1 = non salva)'
        required: false
        default: '0'
      max_docs:
        description: 'Prodotti al massimo in questo giro'
        required: false
        default: '400'

permissions:
  contents: read

concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Credenziali Google (service account Firebase)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: printf '%s' "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/gcloud-key.json"

      - name: Correggi i prodotti
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud-key.json
          DRY: ${{ github.event.inputs.dry || '0' }}
          MAX_DOCS: ${{ github.event.inputs.max_docs || '400' }}
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-admin@12 >/dev/null
          node fix-catalog-categories.mjs

      - name: Dipendenze Worker (wrangler)
        if: ${{ github.event.inputs.dry != '1' }}
        working-directory: cloudflare-worker
        run: npm ci

      - name: Aggiorna il catalogo nel KV (solo le modifiche fatte)
        if: ${{ github.event.inputs.dry != '1' }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          ID="$(npx wrangler kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title==="lillofind-catalog");process.stdout.write(n?n.id:"")}catch(e){}})')"
          if [ -z "$ID" ]; then echo "KV 'lillofind-catalog' non trovato"; exit 1; fi
          npx wrangler kv key get catalog --namespace-id "$ID" > ../scripts/catalog-old.json
          set +e; node ../scripts/patch-catalog-kv.mjs ../scripts/catalog-old.json ../scripts/applied.json; rc=$?; set -e
          if [ "$rc" = 2 ]; then exit 0; fi
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          npx wrangler kv key put catalog --path ../scripts/catalog.json --namespace-id "$ID"
          npx wrangler kv key put "catalog:meta" --path ../scripts/catalog-meta.json --namespace-id "$ID"
          echo "Catalogo aggiornato nel KV $ID"
          curl -s "https://lillofind.conti9708.workers.dev/catalog?meta=1"
